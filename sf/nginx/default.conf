server {
    listen 80;
    server_name sf.local;

    # Symfony 8 usa la carpeta public
    root /var/www/html/public;
    index index.php index.html;

    ## NUEVO: Rate limiting
    ## Zona para API: maximo 10 requests por segundo por IP
    #limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    ## Zona para login: maximo 5 requests por minuto por IP
    # limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    ## NUEVO: Compresion gzip (reduce tamano de respuesta 30-80%)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;
    gzip_comp_level 6;          # Nivel de compresi�n
    gzip_proxied any;           # Comprime incluso para requests via proxy
    gzip_disable "msie6";       # Evitar IE6

    location /health {
        access_log off;
        add_header 'Content-Type' 'text/plain';
        return 200 'OK';
    }

    location /build/ {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # LiipImagineBundle - imágenes generadas dinámicamente
    location ~ ^/media/cache/(.*) {
        try_files $uri /index.php?$query_string;
        
        # Configuración para servir directamente las imágenes cacheadas
        expires 1y;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, immutable";

        # No permitir acceso directo a archivos PHP en este directorio
        location ~ \.php$ {
            deny all;
        }
    }

    # Manejo de rutas principales
    location / {
        try_files $uri /index.php?$query_string;
    }
    
    # PHP-FPM para index.php (optimizado para PHP 8.2)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass sf-app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        
        # Configuraciones clave para Symfony 5
        #fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        #fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Headers para proxies/HTTPS (útil en Docker/cloud)
        #fastcgi_param HTTPS $http_x_forwarded_proto;
        #fastcgi_param HTTP_X-REAL-IP $remote_addr;

        # EXTRA: permite detectar HTTPS si hay proxy inverso en producci�n
        fastcgi_param HTTPS $http_x_forwarded_proto;

        ## NUEVO: Buffers optimizados para Symfony/PHP 8.3
        fastcgi_buffer_size 128k;
        fastcgi_buffers 8 256k;
        fastcgi_busy_buffers_size 512k;
        fastcgi_temp_file_write_size 256k;

        ## NUEVO: Timeouts ajustados
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 120s;

        # Internal para evitar acceso directo
        internal;
    }

    # Denegar acceso directorios internos de Symfony    
    location ~ ^/(config|var|src|translations|migrations)/ {
        deny all;
        return 404;
    }


    # Denegar acceso cualquier otro .php que no sea app.php
    location ~ \.php$ {
        return 404;
    }

    # Denegar acceso archivos ocultos o sensibles (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Cachear assets (CSS, JS, imágenes, fuentes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # para gzip
        add_header Vary "Accept-Encoding"; 
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Favicon y robots.txt (sin logs)
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-Download-Options "noopen" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https:;" always;
    
    # EXTRA: mejor validación de caché
    etag on;
    
    client_max_body_size 50M;

    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log main buffer=16k;
}
